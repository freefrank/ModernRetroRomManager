name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
      - name: Check versions and changelog
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-tools.mjs check
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            package_version=$(node -p "require('./package.json').version")
            tag_version="${GITHUB_REF_NAME#v}"
            test "$tag_version" = "$package_version" || {
              echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
              exit 1
            }
          fi

  windows:
    name: Windows x64 portable, installer and MSIX
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build portable executable and NSIS installer
        run: pnpm tauri build --bundles nsis
      - name: Collect Windows packages
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item src-tauri/target/release/modern-retro-rom-manager.exe "artifacts/ModernRetroRomManager_${version}_windows_x64_portable.exe"
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName "artifacts/ModernRetroRomManager_${version}_windows_x64_setup.exe"
      - name: Build Microsoft Store MSIX
        shell: pwsh
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $identityName = if ($env:MS_STORE_IDENTITY_NAME) { $env:MS_STORE_IDENTITY_NAME } else { "ModernRetroRomManager" }
          $publisher = if ($env:MS_STORE_PUBLISHER) { $env:MS_STORE_PUBLISHER } else { "CN=dotSlash" }
          $publisherDisplayName = if ($env:MS_STORE_PUBLISHER_DISPLAY_NAME) { $env:MS_STORE_PUBLISHER_DISPLAY_NAME } else { "dotSlash" }
          ./scripts/build-msix.ps1 `
            -AppExecutable "src-tauri/target/release/modern-retro-rom-manager.exe" `
            -OutputPath "artifacts/ModernRetroRomManager_${version}_windows_x64_store.msix" `
            -Version $version `
            -IdentityName $identityName `
            -Publisher $publisher `
            -PublisherDisplayName $publisherDisplayName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/*_windows_x64_*
          if-no-files-found: error

  linux-appimage:
    name: Linux x86_64 AppImage
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build AppImage
        run: pnpm tauri build --bundles appimage
      - name: Collect AppImage
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          source_file=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$source_file"
          mkdir -p artifacts
          cp "$source_file" "artifacts/ModernRetroRomManager_${version}_linux_x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: artifacts/*_linux_x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux-appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-tools.mjs notes "$version" > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
